{% extends "base.html" %}
{% block title %}Edutech{% endblock %}
{% block content %}
        <p>교안 생성 시스템에 오신 것을 환영합니다.</p>
        {% if user %}
        {% include "_rate_limit.html" %}
        <form hx-post="/generate" hx-target="#result" hx-indicator="#spinner" hx-request='{"timeout": 180000}' hx-sync="this:drop" hx-disabled-elt="find button" class="info-form">
            <div>
                <label for="concept-input">개념</label>
                <input type="text" id="concept-input" name="concept" required placeholder="개념을 입력하세요"/>
            </div>
            <div>
                <label for="grade-select">학년</label>
                <select name="grade" id="grade-select" required>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                    <option value="4">4학년</option>
                    <option value="5">5학년</option>
                    <option value="6">6학년</option>
                </select>
            </div>
            <button type="submit">생성하기</button>
        </form>
        <div id="spinner" class="htmx-indicator">생성 중입니다... 최대 1분 정도 걸립니다.</div>
        <div id="result"></div>
        {% else %}
        <div class="notice">교안을 생성하려면 <a href="/login">로그인</a>이 필요합니다.</div>
        {% endif %}
{% endblock %}
{% block page_scripts %}
        <script>
            (function () {
                var form = document.querySelector(".info-form");
                // 비로그인 화면에는 생성 폼이 없다.
                if (!form) { return; }
                var generating = false;

                form.addEventListener("htmx:beforeRequest", function () {
                    generating = true;
                });
                form.addEventListener("htmx:afterRequest", function () {
                    generating = false;
                });

                // 커스텀 문구는 최신 브라우저(Chrome/Firefox 등)가 무시하고 자체
                // 고정 문구만 보여준다 — beforeunload 스펙상 그렇게 정해져 있어
                // 우회 불가. e.returnValue를 세팅하는 것만으로 확인창 자체는 뜬다.
                window.addEventListener("beforeunload", function (e) {
                    if (generating) {
                        e.preventDefault();
                        e.returnValue = "";
                    }
                });
            })();
        </script>
{% endblock %}
